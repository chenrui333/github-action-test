name: brew-regression-build
run-name: "Julia #325420 LLVM utility rpath proof"

on:
  workflow_dispatch:
    inputs:
      formula:
        description: Formula under qualification
        required: true
        default: julia

permissions:
  contents: read
  actions: read

env:
  HOMEBREW_DEVELOPER: 1
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_ANALYTICS: 1
  HOMEBREW_NO_BUILD_ERROR_ISSUES: 1
  HOMEBREW_ARM64_TESTING: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  HOMEBREW_NO_AUTOREMOVE: 1
  HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
  HOMEBREW_NO_INSTALL_FROM_API: 1
  HOMEBREW_MAKE_JOBS: 2
  HOMEBREW_LOGS: ${{ github.workspace }}/diagnostics/brew-logs
  HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
  FORMULA: ${{ inputs.formula }}

jobs:
  julia-arm:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate exact target and architecture
        run: |
          test "$FORMULA" = julia
          test "$(uname -m)" = aarch64
          mkdir -p diagnostics
          uname -a > diagnostics/platform.txt
          printf '%s\n' "$GITHUB_SHA" > diagnostics/candidate-commit.txt
      - name: Bootstrap native Homebrew
        shell: bash
        run: |
          bash .github/workflows/scripts/install_homebrew.sh
          echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"
      - name: Pin exact recipe and preserve baseline
        shell: bash
        run: |
          core="$(brew --repository homebrew/core)"
          git -C "$core" fetch --depth=2 origin 792929565ba6ee03d54e0e5bcbfe2f61e1c9955a
          git -C "$core" checkout --detach 792929565ba6ee03d54e0e5bcbfe2f61e1c9955a
          cp .github/workflows/fixtures/julia.rb "$core/Formula/j/julia.rb"
          cmp .github/workflows/fixtures/julia.rb "$core/Formula/j/julia.rb"
          sha256sum .github/workflows/fixtures/julia.rb "$core/Formula/j/julia.rb" > diagnostics/recipe-sources.sha256
          if brew list --formula --versions julia; then
            echo 'Unexpected pre-existing Julia formula; preserving it.'
            exit 1
          fi
          touch diagnostics/no-baseline-julia
          if ! brew list --formula --versions patchelf; then
            touch diagnostics/no-baseline-patchelf
            brew install --formula patchelf
          fi
      - name: Download exact previously source-built candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh run download 43603610990 -R chenrui333/github-action-test \
            -n julia-325420-linux-arm-diagnostic-bottle -D candidate
          printf '%s\n' 'ec6ad363b645cdb5794618ef51548ebc79f65938aff1cd8656f265ce91bf9e48  candidate/julia--1.13.4.arm64_linux.bottle.tar.gz' > diagnostics/bottle.sha256
          sha256sum --check diagnostics/bottle.sha256
          printf '%s\n' 'Source build, formula test and LLVM regression: run 43603610990; original recipe SHA 33b697707a21dc4f60fcd3f4d51232d72170116b0b2766b270a651f16e49e533' > diagnostics/source-provenance.txt
      - name: Pour retained native build
        id: pour
        shell: bash
        run: |
          set -o pipefail
          brew install --formula candidate/julia--1.13.4.arm64_linux.bottle.tar.gz 2>&1 | tee diagnostics/pour.log
          keg="$(brew --prefix julia)"
          sha256sum "$keg/.brew/julia.rb" > diagnostics/installed-original-recipe.sha256
          brew info --json=v2 julia > diagnostics/installed.json
      - name: Apply utility-only source rpath correction
        shell: bash
        run: |
          set -o pipefail
          keg="$(brew --prefix julia)"
          prefix="$(brew --prefix)"
          for tool in "$keg/libexec/julia/"*; do
            if [[ -L "$tool" ]]; then continue; fi
            # Restore the install target's observed pre-bottling rpath.
            patchelf --page-size 65536 --set-rpath "\$ORIGIN/../../lib/julia" "$tool"
            printf '%s\n' "$tool" >> diagnostics/utility-rpaths-before.txt
            patchelf --print-rpath "$tool" >> diagnostics/utility-rpaths-before.txt
            # Same metadata-only correction as the candidate formula.
            patchelf --page-size 65536 --add-rpath "$prefix/lib" "$tool"
            printf '%s\n' "$tool" >> diagnostics/utility-rpaths-after.txt
            patchelf --print-rpath "$tool" >> diagnostics/utility-rpaths-after.txt
          done
      - name: Exercise installed linker and Julia without loader overrides
        shell: bash
        run: |
          set -o pipefail
          keg="$(brew --prefix julia)"
          mkdir linker-proof
          printf '%s\n' 'int value(void) { return 42; }' > linker-proof/value.c
          printf '%s\n' 'int value(void); int main(void) { return value() != 42; }' > linker-proof/main.c
          cc -c linker-proof/value.c -o linker-proof/value.o
          cc -c linker-proof/main.c -o linker-proof/main.o
          env -u LD_LIBRARY_PATH "$keg/libexec/julia/lld" -flavor gnu -r \
            linker-proof/value.o linker-proof/main.o -o linker-proof/combined.o
          cc linker-proof/combined.o -o linker-proof/consumer
          ./linker-proof/consumer
          test "$(env -u LD_LIBRARY_PATH "$keg/bin/julia" --startup-file=no --history-file=no -e 'print(VERSION)')" = 1.13.4
      - name: Verify linkage and formula behavior
        shell: bash
        run: |
          set -o pipefail
          brew linkage --test julia 2>&1 | tee diagnostics/linkage.log
          brew test julia 2>&1 | tee diagnostics/test.log
          brew audit --strict --git julia 2>&1 | tee diagnostics/audit.log
          brew style julia 2>&1 | tee diagnostics/style.log
      - name: Uninstall owned test package
        if: always()
        shell: bash
        run: |
          if [[ -f diagnostics/no-baseline-julia ]] && command -v brew >/dev/null && brew list --formula --versions julia; then
            brew uninstall --formula julia
          fi
          if [[ -f diagnostics/no-baseline-patchelf ]] && brew list --formula --versions patchelf; then
            brew uninstall --formula patchelf
          fi
      - name: Upload incremental qualification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: julia-325420-linux-arm-utility-rpath-proof
          path: diagnostics
          retention-days: 7
