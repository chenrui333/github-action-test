name: brew-regression-build
run-name: "Julia #325420 GC and Linux loader proof"

on:
  workflow_dispatch:
    inputs:
      formula:
        description: Formula under qualification
        required: true
        default: julia

permissions:
  contents: read

env:
  HOMEBREW_DEVELOPER: 1
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_ANALYTICS: 1
  HOMEBREW_NO_BUILD_ERROR_ISSUES: 1
  HOMEBREW_ARM64_TESTING: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  HOMEBREW_NO_AUTOREMOVE: 1
  HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
  HOMEBREW_NO_INSTALL_FROM_API: 1
  HOMEBREW_MAKE_JOBS: 2
  HOMEBREW_LOGS: ${{ github.workspace }}/diagnostics/brew-logs
  HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
  FORMULA: ${{ inputs.formula }}

jobs:
  julia-arm:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate exact target
        run: test "$FORMULA" = julia
      - name: Record resources and add swap
        shell: bash
        run: |
          mkdir -p diagnostics
          {
            uname -a
            lscpu
            free -h
            df -h .
            cat /sys/fs/cgroup/memory.events 2>/dev/null || true
          } | tee diagnostics/resources-before.txt
          sudo fallocate -l 16G "$RUNNER_TEMP/julia.swap"
          sudo chmod 600 "$RUNNER_TEMP/julia.swap"
          sudo mkswap "$RUNNER_TEMP/julia.swap"
          sudo swapon "$RUNNER_TEMP/julia.swap"
          swapon --show | tee diagnostics/swap.txt
          free -h | tee diagnostics/resources-with-swap.txt
      - name: Bootstrap native Homebrew
        shell: bash
        run: |
          bash .github/workflows/scripts/install_homebrew.sh
          echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"
          echo 'HOMEBREW_NO_INSTALL_FROM_API=1' >> "$GITHUB_ENV"
      - name: Pin Julia base and stage exact backport candidate
        shell: bash
        run: |
          core="$(brew --repository homebrew/core)"
          git -C "$core" fetch --depth=2 origin 792929565ba6ee03d54e0e5bcbfe2f61e1c9955a
          git -C "$core" checkout --detach 792929565ba6ee03d54e0e5bcbfe2f61e1c9955a
          test "$(git -C "$core" rev-parse HEAD)" = 792929565ba6ee03d54e0e5bcbfe2f61e1c9955a
          cp .github/workflows/fixtures/julia.rb "$core/Formula/j/julia.rb"
          cmp .github/workflows/fixtures/julia.rb "$core/Formula/j/julia.rb"
          sha256sum .github/workflows/fixtures/julia.rb "$core/Formula/j/julia.rb" > diagnostics/recipe-sources.sha256
          printf '%s\n' "$GITHUB_SHA" > diagnostics/candidate-commit.txt
          brew info --json=v2 julia > diagnostics/recipe.json
          if brew list --formula --versions julia; then
            echo 'Unexpected pre-existing Julia formula; preserving it.'
            exit 1
          fi
          touch diagnostics/no-baseline-julia
      - name: Source build with peak-memory evidence
        id: source
        shell: bash
        run: |
          set -o pipefail
          /usr/bin/time -v -o diagnostics/time.txt brew install --verbose --build-bottle --keep-tmp julia 2>&1 | tee diagnostics/build.log
      - name: Verify installed consumer and package
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          julia="$(brew --prefix julia)/bin/julia"
          test "$(env -u LD_LIBRARY_PATH "$julia" --startup-file=no --history-file=no -e 'print(VERSION)')" = 1.13.4
          brew test julia 2>&1 | tee diagnostics/test.log
          brew linkage --test julia 2>&1 | tee diagnostics/linkage.log
          brew audit --strict --git julia 2>&1 | tee diagnostics/audit.log
          brew style julia 2>&1 | tee diagnostics/style.log
      - name: Run upstream dynamic-index GC regression
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          temp="$(brew ruby -e 'puts HOMEBREW_TEMP')"
          shopt -s nullglob
          builds=("$temp"/s-*/julia-*/julia-1.13.4)
          test "${#builds[@]}" = 1
          build="${builds[0]}"
          fixture="$build/test/llvmpasses/late-lower-gc-dynamic-index.ll"
          test -x "$build/usr/tools/opt"
          test -x "$build/usr/tools/FileCheck"
          test -f "$fixture"
          prefix="$(brew --prefix)"
          export LD_LIBRARY_PATH="$build/usr/lib:$prefix/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          "$build/usr/tools/opt" --load-pass-plugin="$build/usr/lib/libjulia-codegen.so" \
            -passes='function(LateLowerGCFrame)' -verify-each -S "$fixture" \
            | tee diagnostics/gc-lowering.ll \
            | "$build/usr/tools/FileCheck" "$fixture"
      - name: Bottle the source build
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          brew bottle --json julia 2>&1 | tee diagnostics/bottle.log
      - name: Preserve resource diagnostics and uninstall test package
        if: always()
        shell: bash
        run: |
          mkdir -p diagnostics
          {
            free -h
            cat /sys/fs/cgroup/memory.events 2>/dev/null || true
            sudo dmesg --ctime | grep -Ei 'out of memory|killed process|oom-kill' || true
          } | tee diagnostics/resources-after.txt
          if [[ -f diagnostics/no-baseline-julia ]] && command -v brew >/dev/null && brew list --formula --versions julia; then
            brew uninstall --formula julia
          fi
          if swapon --show=NAME --noheadings | grep -Fx "$RUNNER_TEMP/julia.swap"; then
            sudo swapoff "$RUNNER_TEMP/julia.swap"
            sudo rm -f "$RUNNER_TEMP/julia.swap"
          fi
      - name: Preserve diagnostic bottle on failure
        if: ${{ failure() && steps.source.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: julia-325420-linux-arm-diagnostic-bottle
          path: |
            julia--*.bottle*.tar.gz
            julia--*.bottle.json
          retention-days: 1
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: julia-325420-linux-arm-gc-loader-proof
          path: diagnostics
          retention-days: 7
