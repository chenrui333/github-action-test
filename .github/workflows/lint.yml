name: Repository checks

on:
  pull_request:
    paths:
      - '.github/**'
      - 'scripts/**'
      - '**/*.md'
      - 'mise.toml'
      - '.yamllint'
      - '.yamlfmt'
      - 'lychee.toml'
  push:
    branches: [main]
    paths:
      - '.github/**'
      - 'scripts/**'
      - '**/*.md'
      - 'mise.toml'
      - '.yamllint'
      - '.yamlfmt'
      - 'lychee.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5
        with:
          cache: false
      - run: mise run check
