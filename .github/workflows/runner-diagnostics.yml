name: Runner diagnostics
run-name: Diagnose ${{ inputs.runner }} (source build=${{ inputs.source_build }})

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Hosted runner label (macos-14 is a deprecating reproduction target)
        type: choice
        default: ubuntu-24.04
        options:
          - ubuntu-22.04
          - ubuntu-22.04-arm
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-14
          - macos-15
          - macos-15-intel
          - macos-26
      source_build:
        description: Build and test hello from the core Git tap
        type: boolean
        default: false
      debug:
        description: Open an SSH session restricted to the dispatching actor
        type: boolean
        default: false

permissions:
  contents: read

env:
  # `test` and `audit` are test dev commands
  HOMEBREW_DEVELOPER: 1
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_ANALYTICS: 1
  # https://github.com/Homebrew/homebrew-core/blob/2b267008a1315bae4bceb2efb4a9e503e2d00b62/.github/workflows/tests.yml#L16-L17
  HOMEBREW_NO_BUILD_ERROR_ISSUES: 1
  HOMEBREW_ARM64_TESTING: 1
  # save some time
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  # no need to upgrade dependants
  HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
  # https://github.com/Homebrew/homebrew-test-bot/pull/868
  HOMEBREW_NO_INSTALL_FROM_API: 1

jobs:
  diagnose:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    steps:
      - name: Inspect the original runner environment
        shell: bash
        run: |
          printf 'OS=%s arch=%s image=%s version=%s\n' "$RUNNER_OS" "$RUNNER_ARCH" "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
          uname -a
          if command -v brew >/dev/null; then
            brew --version
            brew --prefix
          else
            echo 'Homebrew is not initially on PATH'
          fi
      - name: Set up Homebrew and the core tap
        uses: Homebrew/actions/setup-homebrew@fc695c54c2032716dd4cedd007489c8e32fc8a5d
        with:
          core: true
      - name: Restore Git-tap installs
        shell: bash
        run: echo 'HOMEBREW_NO_INSTALL_FROM_API=1' >> "$GITHUB_ENV"
      - name: Inspect Homebrew
        shell: bash
        run: |
          brew config
          brew --prefix
          core_repo="$(brew --repository homebrew/core)"
          test -d "$core_repo/.git"
          git -C "$core_repo" rev-parse HEAD
          printf 'Core tap: %s\n' "$core_repo"
      - name: Validate a source build
        if: inputs.source_build
        shell: bash
        run: |
          brew update
          if brew list --versions hello >/dev/null 2>&1; then
            brew reinstall --build-from-source hello
          else
            brew install --build-from-source hello
          fi
          brew test hello
          brew linkage --cached hello
          hello --version
      - name: Open an optional debug session
        if: inputs.debug
        uses: owenthereal/action-upterm@47652056242288ccbebd30f836e9885d09a75365 # v1
        with:
          limit-access-to-actor: true
          wait-timeout-minutes: 5
