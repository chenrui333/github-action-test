name: workflow-dispatch

on:
  workflow_dispatch:
    inputs:
      time_window:
        description: 'Job Time Range'
        required: true
        default: '--twoDayWindow'
      manual:
        description: 'Set this if you are running the job manually.'
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - env:
          TIME_WINDOW: ${{ inputs.time_window }}
          MANUAL: ${{ inputs.manual }}
        run: |
          printf 'Job time range arg: %s\n' "$TIME_WINDOW"
          printf 'Job run manually?: %s\n' "$MANUAL"
